name: Daily Health YouTube Upload

on:
  schedule:
    # 05:17 Asia/Seoul. Keep this channel separated from the other daily jobs.
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      openai_health_check:
        description: "OpenAI API key and Responses API only"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  openai-health-check:
    if: github.event_name == 'workflow_dispatch' && inputs.openai_health_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: gpt-5.6-luna
    steps:
      - name: Verify API key authentication
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
          status="$(curl -sS -o models.json -w '%{http_code}' -H "Authorization: Bearer ${OPENAI_API_KEY}" https://api.openai.com/v1/models)"
          echo "OpenAI authentication HTTP status: ${status}"
          test "${status}" = "200" || { jq -r '{type:.error.type,code:.error.code,message:.error.message}' models.json; exit 1; }
      - name: Verify Responses API and target model
        run: |
          set -euo pipefail
          status="$(curl -sS -o response.json -w '%{http_code}' -H "Authorization: Bearer ${OPENAI_API_KEY}" -H 'Content-Type: application/json' --data "$(jq -nc --arg model "${OPENAI_TEXT_MODEL}" '{model:$model,input:"Reply with exactly OK.",max_output_tokens:32,reasoning:{effort:"none"},store:false}')" https://api.openai.com/v1/responses)"
          echo "OpenAI Responses API HTTP status: ${status}"
          test "${status}" = "200" || { jq -r '{type:.error.type,code:.error.code,message:.error.message}' response.json; exit 1; }
          jq -r '{model,status,output_text:([.output[]?.content[]?|select(.type=="output_text")|.text]|join(""))}' response.json

  upload-longform:
    if: github.event_name != 'workflow_dispatch' || inputs.openai_health_check != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_FALLBACK_VOICE_IDS: airYK6ydeWdrJg6gyZA3
      ELEVENLABS_ALLOW_FALLBACK: "true"
      ELEVENLABS_MODEL: eleven_multilingual_v2
      ELEVENLABS_STABILITY: "0.82"
      ELEVENLABS_SIMILARITY: "0.88"
      ELEVENLABS_STYLE: "0.0"
      ELEVENLABS_SPEAKER_BOOST: "true"
      ELEVENLABS_SPEED: "1.0"
      ELEVENLABS_TEXT_NORMALIZATION: "on"
      ELEVENLABS_SEED: "20260604"
      TTS_PROVIDER: elevenlabs
      TTS_ALLOW_FALLBACK: "true"
      OPENAI_TTS_MODEL: gpt-4o-mini-tts
      OPENAI_TTS_VOICE: alloy
      HEYGEN_ENABLED: "false"
      ENABLE_BGM: "false"
      ENABLE_SLIDE_CAPTIONS: "false"
      ENABLE_SLIDE_MOTION: "false"
      BURN_IN_SUBTITLES: "true"
      UPLOAD_YOUTUBE_CAPTIONS: "false"
      IMAGE_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_IMAGE_MODEL: gpt-image-1
      OPENAI_IMAGE_SIZE: 1536x1024
      OPENAI_IMAGE_QUALITY: medium
      OPENAI_TEXT_MODEL: gpt-5.6-luna
      GEMINI_TEXT_MODEL: gemini-2.5-flash
      GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
      SCENE_IMAGE_MAX_WORKERS: "2"
      YOUTUBE_PRIVACY: public
      FONT_FILE: ${{ github.workspace }}/runtime-assets/NotoSansCJKkr-Regular.otf

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare runtime assets
        run: |
          mkdir -p runtime-assets
          curl -L https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf \
            -o runtime-assets/NotoSansCJKkr-Regular.otf

      - name: Install Python dependencies
        run: pip install -r longform_automation/requirements.txt

      - name: Restore YouTube OAuth token
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("token.json").write_text(os.environ["YOUTUBE_TOKEN_JSON"], encoding="utf-8")
          PY
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Generate and upload one unique health video
        run: python longform_automation/daily_longform_upload_v2.py

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-review-package
          path: |
            output/**/*.mp4
            output/**/*.mp3
            output/**/*.srt
            output/**/frames/*.jpg
          if-no-files-found: warn
          retention-days: 7

      - name: Commit health topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add longform_automation/topic-history.json
          git diff --cached --quiet || git commit -m "Record daily health YouTube topic"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
